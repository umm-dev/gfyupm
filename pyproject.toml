[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfyupm"
version = "0.1.0"
description = "Boring universal package manager CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
gfyupm = "gfyupm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
