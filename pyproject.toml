[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gfyupm"
version = "0.1.0"
description = "Boring universal package manager CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []
keywords = ["package-manager", "cli", "packages", "installer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Software Distribution",
]

authors = [
    { name = "Axel" }
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/umm-dev/gfyupm"
Repository = "https://github.com/umm-dev/gfyupm"
Issues = "https://github.com/umm-dev/gfyupm/issues"

[project.scripts]
gfyupm = "gfyupm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
